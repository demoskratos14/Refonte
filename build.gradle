// RACINE -- version de secours : si tu as deja un build.gradle racine qui
// fonctionne dans ton depot, garde le tien et ignore celui-ci.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.4.0"
        // AGP 9 embarque Kotlin ("built-in Kotlin") : plus de plugin org.jetbrains.kotlin.android.
        // On fixe quand meme la version de Kotlin (>= 2.2.10 requis) ainsi que celle du
        // plugin du compilateur Compose, qui doivent toujours etre identiques.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.20"
    }
}

// Necessaire car settings.gradle ne declare pas dependencyResolutionManagement :
// app/build.gradle n a pas de bloc repositories et compte sur celui-ci.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
