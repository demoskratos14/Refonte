name: Build APK

on:
  push:
    branches: [ main ]
  # Les pull requests (dont celles de Dependabot) sont construites et testées avant d'être fusionnées.
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          # Par defaut, cette action essaie aussi d'installer le paquet
          # "tools" (l'ancien outillage Android historique), que Google a
          # retire de son depot -- ce qui fait echouer l'etape avec
          # "Failed to find package 'tools'". On ne demande donc que
          # platform-tools, seul reellement necessaire ici (le reste,
          # build-tools/platforms, est telecharge automatiquement par
          # Gradle/AGP au moment de la compilation).
          packages: "platform-tools"

      # Si le dépôt contient le wrapper (voir le workflow "Générer le Gradle wrapper"), c'est lui
      # qui fixe la version de Gradle. Sinon, on installe la version ci-dessous.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ hashFiles('gradlew') == '' && '9.6.0' || '' }}

      - name: Choisir la commande Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE=gradle" >> "$GITHUB_ENV"
          fi

      - name: Construire l'APK (debug)
        run: $GRADLE assembleDebug --stacktrace

      # L'APK est publié tout de suite : un test qui échoue plus bas rend le
      # workflow rouge, mais ne t'empêche pas de récupérer l'APK.
      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: "Dés d'Aventure"
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      # Tests unitaires (app/src/test) : s'exécutent sur la machine de build,
      # sans émulateur. Un test en échec fait échouer cette étape.
      - name: Lancer les tests unitaires
        run: $GRADLE testDebugUnitTest --stacktrace

      # Lint : analyse statique. Configuré (app/build.gradle) pour ne jamais
      # bloquer : il produit seulement un rapport. "if: always()" = il tourne
      # même si les tests ont échoué, pour avoir les deux rapports.
      - name: Lancer le lint
        if: always()
        run: $GRADLE lintDebug --stacktrace

      # Vérifie que le build release (R8 activé) compile, sans le signer : une règle R8
      # manquante ou une dépendance incompatible se voit ici, avant la vraie release.
      - name: Vérifier le build release (R8, non signé)
        if: always()
        run: $GRADLE assembleRelease --stacktrace

      # Petit résumé lisible directement sur la page du workflow
      # (onglet "Summary"), sans avoir à télécharger les rapports.
      - name: Résumé tests + lint
        if: always()
        shell: python3 {0}
        run: |
          import glob, os
          import xml.etree.ElementTree as ET

          lines = ["## Résultats", ""]

          tests = failures = errors = skipped = 0
          failed = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(f).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(f"{case.get('classname')}.{case.get('name')}")
          if tests:
              ok = tests - failures - errors - skipped
              lines.append(f"**Tests** : {ok}/{tests} réussis, {failures + errors} en échec, {skipped} ignorés")
              lines += [f"- ❌ `{name}`" for name in failed]
          else:
              lines.append("**Tests** : aucun résultat trouvé (l'étape a-t-elle échoué avant de tourner ?)")
          lines.append("")

          lint_file = "app/build/reports/lint-results-debug.xml"
          if os.path.exists(lint_file):
              counts = {}
              top = []
              for issue in ET.parse(lint_file).getroot().iter("issue"):
                  sev = issue.get("severity", "?")
                  counts[sev] = counts.get(sev, 0) + 1
                  if sev in ("Fatal", "Error"):
                      loc = issue.find("location")
                      where = (loc.get("file", "") + ":" + loc.get("line", "?")) if loc is not None else ""
                      top.append(f"- `{issue.get('id')}` {where} : {issue.get('message')}")
              total = sum(counts.values())
              detail = ", ".join(f"{n} {s}" for s, n in sorted(counts.items())) or "aucun problème"
              lines.append(f"**Lint** : {total} problème(s) — {detail}")
              lines += top[:20]
          else:
              lines.append("**Lint** : aucun rapport trouvé")
          lines += ["", "Rapports complets (HTML) : artefacts « Rapport de tests » et « Rapport lint » ci-dessous."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Rapport de tests"
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Publier le rapport lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Rapport lint"
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
