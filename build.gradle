// RACINE -- version de secours : si tu as deja un build.gradle racine qui
// fonctionne dans ton depot, garde le tien et ignore celui-ci.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.4.0"
        // Kotlin est integre a AGP 9 ; on fixe ici une version plus recente que celle
        // qu'AGP embarque. Le plugin Compose DOIT avoir exactement la meme version.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21"
    }
}

// Necessaire car settings.gradle ne declare pas dependencyResolutionManagement :
// app/build.gradle n a pas de bloc repositories et compte sur celui-ci.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
