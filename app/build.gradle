plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.aventure.desdice'
    compileSdk 37

    defaultConfig {
        applicationId "com.aventure.desdice.histoiresmultiples"
        minSdk 24
        targetSdk 37
        // Valeurs par defaut pour les builds locaux/debug. Le workflow "Release signee"
        // les remplace (VERSION_CODE = numero du run, VERSION_NAME = version saisie) :
        // un .aab ou un APK mis a jour doit toujours avoir un versionCode plus grand.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0"

        // Filtrage d'ABI : couvre les appareils 64 bits recents + emulateurs.
        // Tu peux elargir/retirer ce bloc pour couvrir armeabi-v7a/x86
        // (vieux appareils 32 bits).
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // Signature du build release : lue dans des variables d'environnement, fournies par le
    // workflow "Release signee" a partir des secrets GitHub. Sans elles (build debug, pull
    // request, poste local), le build release reste possible mais NON signe.
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // R8 : reduit et obfusque le code. Les regles de app/proguard-rules.pro
            // protegent ce qui est lu par reflexion (voir ce fichier).
            minifyEnabled true
            // shrinkResources reste VOLONTAIREMENT desactive : l'appli cherche des polices
            // (getIdentifier "font") et des musiques (R.raw) par leur nom, ce qu'un
            // nettoyage des ressources supprimerait.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Le build "debug" est celui produit par le workflow GitHub Actions.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    // --- Lint : produit un rapport (HTML + XML) sans jamais bloquer le build ---
    // Rapports : app/build/reports/lint-results-debug.html (et .xml).
    // Passe abortOnError a true le jour ou tu voudras que le build echoue sur une erreur lint.
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
        htmlReport true
        xmlReport true
        textReport false
    }

    testOptions {
        unitTests {
            // Robolectric a besoin des ressources/assets/manifeste fusionnes de l'appli
            // pour faire tourner les ecrans Compose sur la JVM (sans emulateur).
            includeAndroidResources = true
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

// Kotlin est integre a AGP 9 (pas de plugin kotlin-android).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Versions : gradle/libs.versions.toml
    implementation libs.androidx.core.ktx
    // Necessaire pour le theme "Theme.AppCompat.*" declare dans AndroidManifest.xml.
    implementation libs.androidx.appcompat

    // --- Compose ---
    // Le BOM (Bill of Materials) fixe une combinaison coherente de
    // versions pour toutes les librairies "androidx.compose.*"
    // ci-dessous : elles n'ont donc pas leur propre numero de version.
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.material3
    // Icons.Default.Delete/Add/Refresh/Send/PlayArrow (StorySelectorScreen,
    // AiPanel, TotemManagementDialog) : le set "core" suffirait pour ceux-
    // la, mais "extended" evite toute mauvaise surprise si d'autres icones
    // sont ajoutees plus tard.
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose

    // Chargement d'images (AsyncImage) : histoires (StorySelectorScreen),
    // images de fond/totem choisies dans CreateStoryScreen/TotemManagementDialog.
    implementation libs.coil.compose

    // --- Tests unitaires (dossier app/src/test, lances avec : gradle testDebugUnitTest) ---
    testImplementation libs.junit
    // Vraie implementation d'org.json : sur la JVM de test, android.jar ne contient que des
    // "stubs" qui plantent ("not mocked") des qu'on appelle JSONObject.
    testImplementation libs.org.json

    // --- Tests Compose sur la JVM (Robolectric, sans emulateur) ---
    // Ecrans testes dans app/src/test/.../ui ; SDK simule fixe dans
    // app/src/test/resources/robolectric.properties.
    testImplementation libs.robolectric
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui.test.junit4
    // Fournit l'activite vide (ComponentActivity) qu'utilise createComposeRule().
    // Debug uniquement : n'est donc pas dans l'APK release.
    debugImplementation libs.androidx.compose.ui.test.manifest
}

// Nom du fichier .apk genere : "Dés d'Aventure-debug.apk" (au lieu de "app-debug.apk").
base {
    archivesName = "Dés d'Aventure"
}
