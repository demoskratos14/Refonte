plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aventure.desdice'
    compileSdk 34

    defaultConfig {
        applicationId "com.aventure.desdice.histoiresmultiples"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Filtrage d'ABI : couvre les appareils 64 bits recents + emulateurs.
        // Tu peux elargir/retirer ce bloc pour couvrir armeabi-v7a/x86
        // (vieux appareils 32 bits).
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Le build "debug" est celui produit par le workflow GitHub Actions.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    // Compilateur Compose, pour Kotlin 1.9.x (voir build.gradle racine).
    // Avec Kotlin 2.0+, il faut a la place le plugin
    // `org.jetbrains.kotlin.plugin.compose` et supprimer ce bloc.
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

    // --- Lint : produit un rapport (HTML + XML) sans jamais bloquer le build ---
    // Rapports : app/build/reports/lint-results-debug.html (et .xml).
    // Passe abortOnError a true le jour ou tu voudras que le build echoue sur une erreur lint.
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
        htmlReport true
        xmlReport true
        textReport false
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Necessaire pour le theme "Theme.AppCompat.*" declare dans AndroidManifest.xml.
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // --- Compose ---
    // Le BOM (Bill of Materials) fixe une combinaison coherente de
    // versions pour toutes les librairies "androidx.compose.*"
    // ci-dessous : elles n'ont donc pas leur propre numero de version.
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    // Icons.Default.Delete/Add/Refresh/Send/PlayArrow (StorySelectorScreen,
    // AiPanel, TotemManagementDialog) : le set "core" suffirait pour ceux-
    // la, mais "extended" evite toute mauvaise surprise si d'autres icones
    // sont ajoutees plus tard.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    // Chargement d'images (AsyncImage) : histoires (StorySelectorScreen),
    // images de fond/totem choisies dans CreateStoryScreen/TotemManagementDialog.
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // --- Tests unitaires (dossier app/src/test, lances avec : gradle testDebugUnitTest) ---
    testImplementation 'junit:junit:4.13.2'
    // Vraie implementation d'org.json : sur la JVM de test, android.jar ne contient que des
    // "stubs" qui plantent ("not mocked") des qu'on appelle JSONObject.
    testImplementation 'org.json:json:20240303'
}

// Renomme le fichier .apk genere (au lieu de "app-debug.apk").
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "Dés d'Aventure-${variant.buildType.name}.apk"
    }
}
